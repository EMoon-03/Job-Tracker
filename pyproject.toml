[project]
name = "jobtracker"
version = "0.2.0"
description = "A local job application tracker: FastAPI + PostgreSQL with a kanban-style web UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Edward Moon" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# AI help ("Fill from a job posting", Gmail fallback): install one and set its key.
claude = ["anthropic>=0.40"]           # ANTHROPIC_API_KEY
openai = ["openai>=1.40"]              # OPENAI_API_KEY (ChatGPT)

[project.scripts]
jobtracker = "jobtracker.cli:main"

[project.gui-scripts]
# Same command without a console window; `jobtracker install` uses it on Windows.
jobtracker-bg = "jobtracker.cli:background"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Rebuild when any source file changes, not only pyproject.toml, so `uv tool install .`
# never hands back a stale cached build after an update.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
