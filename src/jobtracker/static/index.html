<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<link href="fonts/fonts.css" rel="stylesheet">
<script>
  try { const t = localStorage.getItem('jt-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root{
  /* Layout: summary + stage bar → Gmail / needs-attention lists → tabs → board / list / stats; details slide in from the right.
     One typeface, sentence-case labels, color only where it carries meaning (stage, due, late). */
  --bg:#f7f8fa; --surface:#ffffff; --raised:#f0f2f5; --ink:#1a1d23; --ink-2:#4b5260; --muted:#7c8391;
  --line:#e8eaef; --line-strong:#d3d7de;
  --accent:#e5531c; --accent-ink:#ffffff;
  --danger:#c93434; --warn:#a86300; --ok:#0f8a5f;
  --seq:#2a78d6; --reply:#2a78d6; --noreply:#c9cdd9;
  --s-wishlist:#9097aa; --s-applied:#2a78d6; --s-assessment:#e87ba4; --s-interview:#eda100; --s-offer:#1baf7a;
  --s-rejected:#e34948; --s-withdrawn:#b0b5c3; --s-ghosted:#d3d6df;
  --mono-l:91%; --mono-s:42%; --mono-tl:30%;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:var(--font-body);
  --font-mono:var(--font-body);
  --r:10px;
  --shadow:0 1px 2px rgba(20,24,32,.05), 0 2px 8px rgba(20,24,32,.04);
  --shadow-lg:0 2px 6px rgba(12,14,26,.08), 0 18px 48px rgba(12,14,26,.16);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1a1d22; --raised:#22262d; --ink:#eceef2; --ink-2:#c3c8d1; --muted:#8d94a1;
    --line:#2a2f37; --line-strong:#3a404a;
    --accent:#ff6a33; --accent-ink:#121418;
    --danger:#ff7676; --warn:#e6a23a; --ok:#3ccf95;
    --seq:#3987e5; --reply:#3987e5; --noreply:#3a405c;
    --s-wishlist:#7d849c; --s-applied:#3987e5; --s-assessment:#d55181; --s-interview:#c98500; --s-offer:#199e70;
    --s-rejected:#e66767; --s-withdrawn:#5a6079; --s-ghosted:#40465f;
    --mono-l:22%; --mono-s:28%; --mono-tl:82%;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5), 0 22px 60px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1a1d22; --raised:#22262d; --ink:#eceef2; --ink-2:#c3c8d1; --muted:#8d94a1;
  --line:#2a2f37; --line-strong:#3a404a;
  --accent:#ff6a33; --accent-ink:#121418;
  --danger:#ff7676; --warn:#e6a23a; --ok:#3ccf95;
  --seq:#3987e5; --reply:#3987e5; --noreply:#3a405c;
  --s-wishlist:#7d849c; --s-applied:#3987e5; --s-assessment:#d55181; --s-interview:#c98500; --s-offer:#199e70;
  --s-rejected:#e66767; --s-withdrawn:#5a6079; --s-ghosted:#40465f;
  --mono-l:22%; --mono-s:28%; --mono-tl:82%;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5), 0 22px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.wrap{max-width:1400px;margin:0 auto;padding:22px 16px 72px}
@media (min-width:900px){.wrap{padding:32px 40px 88px}}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono-t{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--font-body);font-size:12px;font-weight:600;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);white-space:nowrap}

/* ---------- top bar ---------- */
.demo-strip{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:-8px 0 22px;padding:9px 14px;background:var(--raised);border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.demo-strip b{font-weight:600;color:var(--ink)}
.demo-strip a{color:var(--ink-2);font-weight:600;margin-left:auto;text-underline-offset:3px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.01em}
.wordmark i{font-style:normal;color:var(--accent)}
.today{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;line-height:1.2;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line-strong)}
.btn.icon{padding:8px;width:36px;justify-content:center}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
#btn-theme .i-sun,#btn-theme.is-dark .i-moon{display:none}
#btn-theme.is-dark .i-sun{display:block}
.btn kbd{border-color:currentColor;background:transparent;color:inherit;opacity:.6}
.actions .btn kbd,.tab kbd,.search kbd{display:none}  /* shortcuts live in tooltips and the ? panel */

/* ---------- scoreboard ---------- */
.score{margin-top:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.stat{min-width:0}
.stat .lab{font-size:14px;font-weight:500;color:var(--muted)}
.stat .big{font-weight:650;font-size:clamp(32px,3.6vw,44px);line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.stat .big.accent{color:var(--accent)}
.stat .sub{font-size:13px;color:var(--muted);margin-top:4px}
.stat .sub b{color:var(--ink-2);font-weight:600}
@media (max-width:760px){ .score{grid-template-columns:repeat(2,minmax(0,1fr))} }
.spectrum{margin-top:28px}
.spec-bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--raised)}
.spec-bar span{display:block;background:var(--c);min-width:6px;transform-origin:left;cursor:pointer}
.spec-bar span:hover{filter:brightness(1.1)}
.loaded-once .spec-bar span{animation:none}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.spec-bar.animate span{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.spec-legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;font-size:13.5px}
.spec-legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);border-radius:4px}
.spec-legend button:hover{color:var(--ink)}
.spec-legend button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spec-legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.spec-legend b{font-weight:600;color:var(--ink)}
.spec-legend .zero{opacity:.45}

.banner{margin-top:16px;padding:10px 14px;border-radius:9px;font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface))}

/* ---------- today queue ---------- */
.queue{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.q-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px 10px}
.q-h h2{font-size:16px;font-weight:650;display:flex;align-items:baseline;gap:8px}
.q-h h2 .n{font-size:14px;font-weight:500;color:var(--muted)}
.q-row{display:grid;grid-template-columns:8px minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.q-row .mg,.ib-row .mg{display:none}
.q-row:first-of-type{border-top:0}
.q-row .sev{width:8px;height:8px;border-radius:50%}
.q-row .sev.late{background:var(--danger)} .q-row .sev.due{background:var(--warn)} .q-row .sev.quiet{background:var(--line-strong)}
.q-who{min-width:0;cursor:pointer;line-height:1.3}
.q-who b{font-weight:600}
.q-who span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-msg{font-size:14px;font-weight:500}
.q-msg.late{color:var(--danger)} .q-msg.due{color:var(--warn)} .q-msg.quiet{color:var(--muted)}
.q-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.q-more{padding:6px 10px;border-top:1px solid var(--line)}
.inbox .q-h .sub{font-size:13px;color:var(--muted)}
.ib-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.ib-row:first-of-type{border-top:0}
.ib-what{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;min-width:0}
.ib-what .arrow{color:var(--muted)}
.ib-subj{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
@media (max-width:760px){ .ib-row{grid-template-columns:minmax(0,1fr)} .ib-row .q-act{justify-content:flex-start} }
.btn.busy{opacity:.7;cursor:progress}
@media (max-width:760px){
  .q-row{grid-template-columns:8px minmax(0,1fr)}
  .q-msg,.q-act{grid-column:2}
  .q-act{justify-content:flex-start}
}

/* ---------- monogram ---------- */
.mg{--size:34px;width:var(--size);height:var(--size);flex:none;border-radius:9px;display:grid;place-items:center;
  background:hsl(var(--h) var(--mono-s) var(--mono-l));color:hsl(var(--h) 55% var(--mono-tl));
  font-weight:700;font-size:calc(var(--size) * .38);text-transform:uppercase}
.mg.lg{--size:52px;border-radius:13px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:40px}
.tabs{display:inline-flex;gap:4px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:8px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab kbd{opacity:.7}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;flex:1;justify-content:flex-end;align-items:center}
.search{flex:1 1 220px;max-width:360px;position:relative}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
select{cursor:pointer}
textarea{resize:vertical;line-height:1.5}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:16px;overflow-x:auto;padding:2px 2px 12px;margin-top:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-height:260px;border-radius:var(--r);padding:0 0 10px;transition:background .15s}
.col.drop{background:color-mix(in srgb,var(--c) 10%,transparent);outline:2px dashed var(--c);outline-offset:2px}
.col-h{display:flex;align-items:center;gap:8px;padding:0 4px 6px}
.col-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.col-h .t{font-weight:650;font-size:15px}
.col-h .n{font-size:14px;color:var(--muted);font-weight:500}
.col-h .n.zero{opacity:.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;transition:box-shadow .15s, transform .15s, border-color .15s}
.card:hover{border-color:var(--line-strong)}
.card .mg,.card .pips{display:none}
.card:focus{outline:none}
.card.kf,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.dragging{opacity:.4}
.c-head{display:flex;gap:10px;align-items:flex-start}
.c-title{min-width:0;flex:1}
.co{font-weight:650;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.role{font-size:13.5px;color:var(--ink-2);line-height:1.35;margin-top:1px;overflow-wrap:anywhere}
.c-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px}
.c-next{font-size:13px;border-radius:7px;padding:6px 9px;background:var(--raised);display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:2px}
.c-next .what{font-weight:500;min-width:0;overflow-wrap:anywhere}
.c-next .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.c-next.late{background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.c-next.late .when{color:var(--danger);font-weight:600}
.c-next.due{background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.c-next.due .when{color:var(--warn);font-weight:600}
.c-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--c)}
.outcome{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-right:auto}
.outcome::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.empty-col{font-size:13px;color:var(--muted);padding:18px 10px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r)}

/* ---------- list ---------- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
tr.row.kf td{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
tr.row.kf td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.row:focus{outline:none}
.cell-co{display:flex;gap:10px;align-items:center;min-width:220px}
.cell-co .mg{--size:28px;border-radius:7px}
.cell-co b{font-weight:600;display:block;line-height:1.25}
.cell-co span{color:var(--muted);font-size:13px}
.stage-tag{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13.5px;white-space:nowrap}
.stage-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.muted{color:var(--muted)}
.late-t{color:var(--danger);font-weight:600}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}

/* ---------- stats ---------- */
.stats{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;grid-column:span 12;min-width:0}
@media (min-width:980px){ .span-7{grid-column:span 7} .span-5{grid-column:span 5} .span-6{grid-column:span 6} }
.p-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.p-h h3{font-size:16px;font-weight:650}
.p-h .note{font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:600;font-size:12px}
.chart .big-v{fill:var(--ink);font-weight:650;font-size:24px}
.chart .conv{fill:var(--ink-2);font-weight:600}
.chart [data-tip]{cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.heat{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:11px;color:var(--muted);padding-top:18px}
.heat-days span{height:var(--cell);line-height:var(--cell)}
.heat-scroll{overflow-x:auto}
.heat-months{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cell);gap:3px;font-size:11px;color:var(--muted);height:16px;margin-bottom:2px;white-space:nowrap}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));grid-auto-columns:var(--cell);gap:3px}
.heat-grid i{border-radius:3px;background:var(--raised)}
.heat-grid i.l1{background:color-mix(in srgb,var(--seq) 30%,var(--raised))}
.heat-grid i.l2{background:color-mix(in srgb,var(--seq) 55%,var(--raised))}
.heat-grid i.l3{background:color-mix(in srgb,var(--seq) 80%,var(--raised))}
.heat-grid i.l4{background:var(--seq)}
.heat-grid i.future{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.heat-key{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:flex-end}
.heat-key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--raised);border-radius:9px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.bd-row{display:grid;grid-template-columns:minmax(90px,130px) 36px 1fr minmax(110px,auto);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.bd-row:first-child{border-top:0}
.bd-row .sent{color:var(--muted);text-align:right;font-size:13.5px}
.bd-track{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.bd-track i{display:block;height:100%;background:var(--reply);border-radius:0 3px 3px 0}
.bd-row .what{font-size:13px;color:var(--ink-2)}
.bd-row .what b{color:var(--ink);font-weight:600}
.bd-head{display:grid;grid-template-columns:minmax(90px,130px) 36px 1fr minmax(110px,auto);gap:12px;font-size:13px;color:var(--muted);font-weight:600;padding-bottom:6px}
.bd-head span:nth-child(2){text-align:right}
.p-empty{color:var(--muted);font-size:14px;padding:18px 0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;box-shadow:var(--shadow-lg);max-width:260px;white-space:pre-line;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}

/* ---------- detail panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,8,16,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:19}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:20;box-shadow:var(--shadow-lg)}
.drawer.open{transform:none}
.dr-top{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 20px 16px}
.dr-id{display:flex;gap:14px;align-items:flex-start}
.dr-names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dr-names input{border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-7px;border-radius:7px;width:100%}
.dr-names input:hover{border-color:var(--line)}
.dr-names input:focus{border-color:var(--line-strong);background:var(--surface)}
#f_company{font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.015em}
#f_role{font-size:15px;color:var(--ink-2)}
.dr-tools{display:flex;gap:6px}
.stepper{display:flex;gap:3px;margin-top:16px}
.step{flex:1;border:0;font:inherit;font-size:13px;font-weight:600;padding:8px 4px;background:var(--raised);color:var(--muted);cursor:pointer;position:relative;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-radius:0 8px 8px 0}
.step.done{background:var(--raised);color:var(--ink);box-shadow:inset 0 -2px 0 var(--c)}
.step.cur{background:var(--c);color:#fff}
:root[data-theme="dark"] .step.cur{color:#121418}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .step.cur{color:#121418} }
.step:hover:not(.cur){color:var(--ink)}
.closeout{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.closeout select{font-size:13px;padding:5px 8px}
.closeout .stage-tag{color:var(--ink)}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
.next-box{background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr 170px;gap:10px}
.next-box .f label{color:var(--ink)}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.sect h4{margin:0 0 12px;font-size:15px;font-weight:650;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid.three{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f .row2{display:flex;gap:6px}
.f .row2 input{flex:1}
@media (max-width:560px){ .fgrid,.fgrid.three,.next-box{grid-template-columns:1fr} }
.tl-add{display:flex;gap:6px;flex-wrap:wrap}
.tl-add input[type=date]{flex:0 0 150px}
.tl-add input[type=text]{flex:1 1 180px}
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:83px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:72px 14px 1fr auto;gap:10px;align-items:start;padding:5px 0;font-size:14px;position:relative}
.tl .d{font-size:12.5px;color:var(--muted);padding-top:1px;text-align:right}
.tl .m{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--surface);border:2px solid var(--c, var(--line-strong));position:relative;z-index:1}
.tl .m.stage{background:var(--c)}
.tl .x{all:unset;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;opacity:0}
.tl li:hover .x,.tl .x:focus-visible{opacity:1}
.tl .x:hover{color:var(--danger)}
.tl .x:focus-visible{outline:2px solid var(--accent)}
.tl .t b{font-weight:600}
.confirm{display:none;gap:8px;align-items:center;font-size:14px;padding:10px 20px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-top:1px solid var(--line);flex-wrap:wrap}
.confirm.open{display:flex}
.dr-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap;align-items:center}
.dr-foot .r{display:flex;gap:8px;align-items:center}
.dirty-note{font-size:13px;color:var(--warn);font-weight:600}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;padding:16px;background:rgba(6,8,16,.5)}
.modal.open{display:flex}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(700px,100%);max-height:92%;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.box h2{font-size:20px;font-weight:700}
.box p{margin:0;color:var(--muted);font-size:14px;max-width:64ch}
.box .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.drop-zone{border:1.5px dashed var(--line-strong);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop-zone.over{border-color:var(--accent);color:var(--ink)}
.stage-pick{display:flex;gap:8px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.keys h3{grid-column:1/-1;font-size:14px;font-weight:650;color:var(--ink);margin-top:12px}
.keys div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.keys div span:last-child{display:flex;gap:4px}
.sec-h{font-size:14px;font-weight:650;color:var(--ink);margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:500;z-index:50;box-shadow:var(--shadow-lg);max-width:min(560px,calc(100% - 32px));display:none}
.toast.show{display:block}

@media (prefers-reduced-motion: reduce){
  .drawer,.scrim,.card,.col{transition:none}
  .spec-bar.animate span{animation:none}
}
</style>

<div class="wrap">
  <div class="demo-strip hidden" id="demo-strip" role="note"></div>
  <div class="topbar">

    <div class="actions">

        <svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg></button>
      <button class="btn icon ghost" id="btn-keys" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 7h.01M6.5 7h.01M9 7h.01M11.5 7h.01M5 10h6"/></svg></button>
    </div>
  </div>

  <section class="score" id="score" aria-label="Summary"></section>
  <section class="spectrum" id="spectrum" aria-label="Applications by stage"></section>
  <div id="banner"></div>
  <section class="queue inbox hidden" id="inbox" aria-label="Updates from Gmail"></section>
  <section class="queue hidden" id="queue" aria-label="Needs attention"></section>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" id="tab-board" data-view="board" type="button">Board <kbd>1</kbd></button>
      <button class="tab" role="tab" id="tab-list" data-view="list" type="button">List <kbd>2</kbd></button>
      <button class="tab" role="tab" id="tab-stats" data-view="stats" type="button">Stats <kbd>3</kbd></button>
    </div>
    <div class="filters" id="filters">
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="q" type="search" placeholder="Search companies, roles, notes" aria-label="Search applications">
        <kbd>/</kbd>
      </div>
      <select id="f-sector" aria-label="Filter by sector"></select>
      <select id="f-type" aria-label="Filter by job type"></select>
      <select id="f-stage" aria-label="Filter by stage"></select>
    </div>
  </div>

  <main id="view"></main>
</div>

<!-- Detail panel -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Application details" aria-hidden="true">
  <div class="dr-top">
    <div class="dr-id">
      <span class="mg lg" id="dr-mg">?</span>
      <div class="dr-names">
        <input id="f_company" name="company" form="dr-form" placeholder="Company" aria-label="Company" autocomplete="off">
        <input id="f_role" name="role" form="dr-form" placeholder="Role title" aria-label="Role" autocomplete="off">
      </div>
      <div class="dr-tools">
        <a class="btn small hidden" id="f_url_open" target="_blank" rel="noopener">Posting ↗</a>
        <button class="btn ghost small" id="dr-close" type="button" aria-label="Close">Close <kbd>Esc</kbd></button>
      </div>
    </div>
    <div class="stepper" id="stepper" role="group" aria-label="Stage"></div>
    <div class="closeout">
      <span id="stage-now"></span>
      <span style="margin-left:auto">Close out as</span>
      <select id="f_close" aria-label="Close out as">
        <option value="">—</option><option value="rejected">Rejected</option><option value="withdrawn">Withdrawn</option><option value="ghosted">Ghosted</option>
      </select>
    </div>
  </div>
  <form class="dr-body" id="dr-form" autocomplete="off">
    <input type="hidden" name="stage" id="f_stage">
    <div class="next-box">
      <div class="f"><label for="f_nextStep">Next step</label><input id="f_nextStep" name="nextStep" placeholder="e.g. Technical interview with the data team"></div>
      <div class="f"><label for="f_followUp">By / on</label><input id="f_followUp" name="followUp" type="date"></div>
    </div>
    <div class="sect">
      <h4>The role</h4>
      <div class="fgrid three">
        <div class="f"><label for="f_type">Type</label><select id="f_type" name="type"></select></div>
        <div class="f"><label for="f_sector">Sector</label><select id="f_sector" name="sector"></select></div>
        <div class="f"><label for="f_mode">Work mode</label><select id="f_mode" name="mode"></select></div>
        <div class="f" style="grid-column:span 2"><label for="f_location">Location</label><input id="f_location" name="location" placeholder="e.g. New York, NY"></div>
        <div class="f"><label for="f_salary">Pay</label><input id="f_salary" name="salary" placeholder="e.g. $45/hr"></div>
      </div>
    </div>
    <div class="sect">
      <h4>Dates</h4>
      <div class="fgrid">
        <div class="f"><label for="f_appliedDate">Applied on</label><input id="f_appliedDate" name="appliedDate" type="date"></div>
        <div class="f"><label for="f_deadline">Apply by</label><input id="f_deadline" name="deadline" type="date"></div>
      </div>
    </div>
    <div class="sect">
      <h4>People</h4>
      <div class="fgrid three">
        <div class="f"><label for="f_source">Found via</label><select id="f_source" name="source"></select></div>
        <div class="f"><label for="f_referral">Referred by</label><input id="f_referral" name="referral"></div>
        <div class="f"><label for="f_contact">Recruiter / contact</label><input id="f_contact" name="contact"></div>
      </div>
    </div>
    <div class="sect">
      <h4>Materials</h4>
      <div class="fgrid">
        <div class="f full"><label for="f_url">Posting link</label><input id="f_url" name="url" type="url" placeholder="https://"></div>
        <div class="f full"><label for="f_resume">Resume version</label><input id="f_resume" name="resume" placeholder="e.g. resume-ml-v3.pdf"></div>

  <div class="confirm" id="dr-confirm">

  </div>
  <div class="dr-foot">

      <button class="btn" id="dr-cancel" type="button">Cancel</button>

  </div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script>
(() => {
"use strict";

/* ================= constants ================= */
const STAGE_ORDER = ['wishlist','applied','assessment','interview','offer','rejected','withdrawn','ghosted'];
const PIPE = ['wishlist','applied','assessment','interview','offer'];
const STAGE_LABEL = {wishlist:'Wishlist',applied:'Applied',assessment:'Assessment',interview:'Interviewing',offer:'Offer',rejected:'Rejected',withdrawn:'Withdrawn',ghosted:'Ghosted'};
const STEP_LABEL = {wishlist:'Wishlist',applied:'Applied',assessment:'Assessment',interview:'Interview',offer:'Offer'};
const ACTIVE = new Set(['applied','assessment','interview','offer']);
const CLOSED = new Set(['rejected','withdrawn','ghosted']);
const COLUMNS = [
  {id:'wishlist',label:'Wishlist',stages:['wishlist'],hint:'Roles you plan to apply to'},
  {id:'applied',label:'Applied',stages:['applied'],hint:'Waiting to hear back'},
  {id:'assessment',label:'Assessment',stages:['assessment'],hint:'OAs, take-homes, HireVues'},
  {id:'interview',label:'Interviewing',stages:['interview'],hint:'Screens and interviews'},
  {id:'offer',label:'Offer',stages:['offer'],hint:'Nothing here yet'},
  {id:'closed',label:'Closed',stages:['rejected','withdrawn','ghosted'],color:'rejected',hint:'Rejected, withdrawn or ghosted'},
];
const TYPES = ['Internship','Full-time','Part-time','Co-op','Contract'];
const SECTORS = ['Finance','Consulting','Defense','Tech','Government','Other'];
const SOURCES = ['Company site','LinkedIn','Handshake','Indeed','Harper','Referral','Recruiter','Career fair','Other'];
const MODES = ['On-site','Hybrid','Remote'];
const FIELDS = [
  ['company','Company'],['role','Role'],['stage','Stage'],['type','Type'],['sector','Sector'],
  ['location','Location'],['mode','Work mode'],['salary','Pay'],['appliedDate','Date applied'],
  ['deadline','Apply by'],['nextStep','Next step'],['followUp','Next step date'],['source','Found via'],['referral','Referred by'],
  ['contact','Recruiter / contact'],['url','Posting link'],['resume','Resume version'],['notes','Notes']
];
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

/* ================= state ================= */
const state = {
  apps:new Map(), loaded:false, offline:false, loadError:false, extract:false, animated:false,
  view:'board', q:'', fSector:'', fType:'', fStage:'',
  sort:{key:'last',dir:'desc'}, queueAll:false, focusId:null, bdDim:'source',
  gmail:{configured:false, lastSyncAt:null, syncing:false}, suggestions:[],
};
let edit = null; // {id, isNew, original, draft, dirty}

/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = () => isoOf(new Date());
const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(iso, forceYear){
  const d = parseISO(iso); if (!d) return '—';
  const s = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  return (forceYear || d.getFullYear() !== new Date().getFullYear()) ? `${s}, ${d.getFullYear()}` : s;
}
function relDay(iso){
  const n = daysBetween(TODAY(), iso);
  if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday';
  if (n > 1 && n < 7) return DOW[parseISO(iso).getDay()];
  return fmtDate(iso);
}
const clone = o => JSON.parse(JSON.stringify(o || {}));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'}`;

function hueOf(s){ let h = 0; for (const ch of String(s || '?').toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; }
function initials(name){
  const words = String(name || '?').replace(/[^\p{L}\p{N}\s&-]/gu, ' ').split(/[\s-]+/).filter(w => w && !/^(the|of|and|&|inc|llc|co|corp|group)$/i.test(w));
  if (!words.length) return '?';
  if (words.length === 1) return words[0].slice(0, 2);
  return (words[0][0] + words[1][0]);
}
const mgHTML = (name, cls='') => `<span class="mg ${cls}" style="--h:${hueOf(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

function lastActivity(a){
  let best = a.appliedDate || '';
  (a.events || []).forEach(e => { if (e.date && e.date > best) best = e.date; });
  if (!best && a.createdAt) best = isoOf(new Date(a.createdAt));
  return best;
}
function stageSince(a){
  const ev = (a.events || []).filter(e => e.kind === 'stage' && e.stage === a.stage && e.date).map(e => e.date).sort();
  return ev.length ? ev[ev.length - 1] : (a.appliedDate || (a.createdAt ? isoOf(new Date(a.createdAt)) : ''));
}
function reached(a){
  const s = new Set([a.stage]);
  (a.events || []).forEach(e => { if (e.kind === 'stage' && e.stage) s.add(e.stage); });
  return s;
}
const appliedEver = a => !!a.appliedDate || [...reached(a)].some(s => ['applied','assessment','interview','offer','rejected','ghosted'].includes(s));
const respondedEver = a => [...reached(a)].some(s => ['assessment','interview','offer','rejected'].includes(s));
const interviewedEver = a => [...reached(a)].some(s => ['interview','offer'].includes(s));
const offerEver = a => reached(a).has('offer');
function firstResponseDate(a){
  const ds = (a.events || []).filter(e => e.kind === 'stage' && ['assessment','interview','offer','rejected'].includes(e.stage) && e.date).map(e => e.date).sort();
  return ds[0] || '';
}
function furthestPipe(a){
  let best = 0; reached(a).forEach(s => { const i = PIPE.indexOf(s); if (i > best) best = i; });
  return best;
}
function nextStageOf(a){ const i = PIPE.indexOf(a.stage); return i >= 0 && i < PIPE.length - 1 ? PIPE[i + 1] : null; }
function prevStageOf(a){
  if (CLOSED.has(a.stage)) return PIPE[Math.max(1, furthestPipe(a))];
  const i = PIPE.indexOf(a.stage); return i > 0 ? PIPE[i - 1] : null;
}
function nextInfo(a){
  const t = TODAY();
  if (CLOSED.has(a.stage)) return null;
  if (a.nextStep || a.followUp) {
    const sev = a.followUp ? (a.followUp < t ? 'late' : a.followUp === t ? 'due' : '') : '';
    return {what: a.nextStep || 'Follow up', when: a.followUp ? relDay(a.followUp) : '', sev};
  }

const chains = new Map();
function writeError(e){

function persist(id, data){
  const doc = clone(data); delete doc.id; delete doc.updatedAt;
  state.apps.set(id, Object.assign({}, doc, {updatedAt: Date.now()})); render();
  const prev = chains.get(id) || Promise.resolve();
  const p = prev.catch(() => {}).then(() => api('PUT', `/api/applications/${id}`, doc)).then(saved => {
    state.offline = false;
    if (saved) { const {id: _ignored, ...rest} = saved; if (state.apps.has(id)) state.apps.set(id, rest); }
    render();
  });
  p.catch(err => { writeError(err); refresh(); });
  chains.set(id, p);
  return p;
}
function removeApp(id){
  state.apps.delete(id); if (state.focusId === id) state.focusId = null; render();
  const prev = chains.get(id) || Promise.resolve();
  const p = prev.catch(() => {}).then(() => api('DELETE', `/api/applications/${id}`));
  p.catch(err => { writeError(err); refresh(); });
  chains.set(id, p);
  return p;
}
async function refresh(){

    const m = new Map(); list.forEach(a => { const {id, ...rest} = a; m.set(id, rest); });

function moveStage(id, stage, quiet){

  const d = clone(a);
  d.stage = stage;
  d.events = d.events || [];
  d.events.push({date: TODAY(), kind:'stage', stage, text:''});
  if (stage === 'applied' && !d.appliedDate) d.appliedDate = TODAY();
  if (CLOSED.has(stage)) { d.nextStep = ''; d.followUp = ''; }
  persist(id, d);

}

/* ================= filtering ================= */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return [...state.apps.entries()].map(([id, a]) => Object.assign({id}, a)).filter(a => {
    if (state.fSector && a.sector !== state.fSector) return false;
    if (state.fType && a.type !== state.fType) return false;
    if (state.fStage === 'active' && !ACTIVE.has(a.stage)) return false;
    if (state.fStage === 'closed' && !CLOSED.has(a.stage)) return false;
    if (state.fStage && !['active','closed'].includes(state.fStage) && a.stage !== state.fStage) return false;
    if (q) {
      const hay = [a.company, a.role, a.location, a.notes, a.contact, a.referral, a.source, a.sector, a.type, a.nextStep,
        ...(a.events || []).map(e => e.text)].join(' ').toLowerCase();

function queueItems(){
  const t = TODAY(); const out = [];
  for (const [id, a] of state.apps) {
    if (CLOSED.has(a.stage)) continue;

      const late = a.followUp < t;
      out.push({id, a, kind:'follow', sev: late ? 'late' : 'due', key: a.followUp,
        text: `${a.nextStep || 'Follow up'} · ${late ? `was due ${relDay(a.followUp)}` : 'today'}`});
    } else if (a.stage === 'wishlist' && a.deadline && daysBetween(t, a.deadline) <= 7) {
      const n = daysBetween(t, a.deadline);
      out.push({id, a, kind:'deadline', sev: n <= 1 ? 'late' : 'due', key: a.deadline,
        text: n < 0 ? `Deadline passed ${fmtDate(a.deadline)}` : n === 0 ? 'Apply today, it closes tonight' : `Apply by ${relDay(a.deadline)} (${plural(n, 'day')})`});
    } else if (!a.followUp && (a.stage === 'applied' || a.stage === 'assessment' || a.stage === 'interview')) {
      const last = lastActivity(a); if (!last) continue;
      const n = daysBetween(last, t), limit = a.stage === 'applied' ? 21 : 10;
      if (n >= limit) out.push({id, a, kind:'stale', sev:'quiet', key: last,

    }

}

function niceTop(max){

function roundTop(x, y, w, h, r){
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function funnelSVG(steps){
  const W = 640, H = 250, T = 44, B = 34, L = 6, R = 6;
  const max = Math.max(1, steps[0].n);
  const slot = (W - L - R) / steps.length, bw = Math.min(96, slot * 0.5);
  const ih = H - T - B;
  let g = `<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--line-strong)"/>`;
  steps.forEach((s, i) => {
    const cx = L + slot * i + slot / 2, h = ih * s.n / max, x = cx - bw / 2, y = T + ih - h;
    g += `<path d="${roundTop(x, y, bw, h, 4)}" fill="var(--c, var(--seq))" style="--c:var(--s-${s.c})" data-tip="${s.label}: ${s.n}${i ? `\n${pct(s.n, steps[0].n)}% of applications sent` : ''}"/>`;
    g += `<text class="big-v" x="${cx}" y="${Math.min(y - 8, T + ih - 8)}" text-anchor="middle">${s.n}</text>`;
    g += `<text x="${cx}" y="${H - 12}" text-anchor="middle">${s.label}</text>`;
    if (i) {
      const px = L + slot * (i - 1) + slot / 2;

      g += `<text class="conv" x="${(px + cx) / 2}" y="${T + ih - 6}" text-anchor="middle">→ ${conv}</text>`;

function weeksBack(n){
  const now = parseISO(TODAY());

}
function weeklySVG(apps){
  const weeks = weeksBack(12).map(w => Object.assign(w, {sent:0, heard:0}));
  apps.forEach(a => {
    if (!a.appliedDate) return;
    const w = weeks.find(w => a.appliedDate >= w.start && a.appliedDate < w.end); if (!w) return;
    w.sent++; if (respondedEver(a)) w.heard++;
  });
  const top = niceTop(Math.max(0, ...weeks.map(w => w.sent)));
  const W = 640, H = 230, L = 28, R = 6, T = 12, B = 30;
  const iw = W - L - R, ih = H - T - B, bw = iw / weeks.length;
  const y = v => T + ih - (v / top) * ih;
  let g = '';
  [0, top / 2, top].forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="2 4"' : ''}/>`;
    g += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  });
  weeks.forEach((w, i) => {
    const x = L + i * bw + bw * 0.2, wd = bw * 0.6, cur = i === weeks.length - 1;
    const tip = `Week of ${fmtDate(w.start)}${cur ? ' (this week)' : ''}\n${plural(w.sent, 'application')} sent · ${w.heard} heard back`;
    g += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${tip}"/>`;
    if (w.sent) {
      const hh = y(0) - y(w.heard), nh = w.sent - w.heard;
      const yTop = y(w.sent);
      if (nh > 0) g += `<path d="${roundTop(x, yTop, wd, y(w.heard) - yTop - (w.heard ? 2 : 0), 4)}" fill="var(--noreply)" pointer-events="none"/>`;
      if (w.heard) g += nh > 0 ? `<rect x="${x}" y="${y(w.heard)}" width="${wd}" height="${hh}" fill="var(--reply)" pointer-events="none"/>`
                               : `<path d="${roundTop(x, y(w.heard), wd, hh, 4)}" fill="var(--reply)" pointer-events="none"/>`;
      g += `<text class="v" x="${x + wd / 2}" y="${yTop - 6}" text-anchor="middle" pointer-events="none">${w.sent}</text>`;
    }
    if (i % 2 === 1 || cur) {
      const d = parseISO(w.start);
      g += `<text x="${x + wd / 2}" y="${H - 10}" text-anchor="middle" ${cur ? 'style="fill:var(--ink);font-weight:600"' : ''}>${cur ? 'This wk' : MONTHS[d.getMonth()] + ' ' + d.getDate()}</text>`;
    }
  });
  return {svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications sent per week over the last 12 weeks">${g}</svg>`,
          total: weeks.reduce((s, w) => s + w.sent, 0)};
}
function waitSVG(waits){

  bins.forEach(b => b.n = waits.filter(w => w >= b.lo && w <= b.hi).length);
  const top = niceTop(Math.max(0, ...bins.map(b => b.n)));
  const W = 420, H = 210, L = 24, R = 4, T = 14, B = 34;
  const iw = W - L - R, ih = H - T - B, bw = iw / bins.length;
  const y = v => T + ih - (v / top) * ih;
  let g = `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"/>`;
  bins.forEach((b, i) => {
    const x = L + i * bw + bw * 0.16, wd = bw * 0.68;
    g += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${b.l} days: ${plural(b.n, 'reply')}"/>`;
    if (b.n) {
      g += `<path d="${roundTop(x, y(b.n), wd, y(0) - y(b.n), 4)}" fill="var(--reply)" pointer-events="none"/>`;
      g += `<text class="v" x="${x + wd / 2}" y="${y(b.n) - 6}" text-anchor="middle" pointer-events="none">${b.n}</text>`;
    }
    g += `<text x="${x + wd / 2}" y="${H - 16}" text-anchor="middle">${b.l}</text>`;
  });

function heatHTML(all){
  const counts = new Map();
  const bump = (d, what) => { if (!d) return; const c = counts.get(d) || {n:0, what:[]}; c.n++; c.what.push(what); counts.set(d, c); };
  all.forEach(a => {
    const name = a.company || 'Untitled';
    const evs = a.events || [];
    if (a.appliedDate && !evs.some(e => e.kind === 'stage' && e.stage === 'applied' && e.date === a.appliedDate)) bump(a.appliedDate, `Applied: ${name}`);
    evs.forEach(e => bump(e.date, e.kind === 'stage' ? `${name} → ${STAGE_LABEL[e.stage] || e.stage}` : `${name}: ${e.text}`));
  });
  const weeks = weeksBack(18), t = TODAY();
  const level = n => n === 0 ? '' : n === 1 ? 'l1' : n === 2 ? 'l2' : n <= 4 ? 'l3' : 'l4';
  let cells = '', months = '', lastMonth = -1, total = 0, activeDays = 0;
  weeks.forEach(w => {
    const d0 = parseISO(w.start);
    months += `<span>${d0.getMonth() !== lastMonth ? MONTHS[d0.getMonth()] : ''}</span>`; lastMonth = d0.getMonth();
    for (let k = 0; k < 7; k++) {
      const iso = addDays(w.start, k);
      if (iso > t) { cells += `<i class="future"></i>`; continue; }
      const c = counts.get(iso); const n = c ? c.n : 0; total += n; if (n) activeDays++;
      const tip = `${DOW[parseISO(iso).getDay()]} ${fmtDate(iso)}: ${n ? plural(n, 'update') : 'no activity'}${c ? '\n' + c.what.slice(0, 4).join('\n') + (c.what.length > 4 ? `\n+${c.what.length - 4} more` : '') : ''}`;
      cells += `<i class="${level(n)}" data-tip="${esc(tip)}"></i>`;
    }

      <div class="heat-days"><span></span><span>Tue</span><span></span><span>Thu</span><span></span><span>Sat</span><span></span></div>
      <div class="heat-scroll"><div class="heat-months">${months}</div><div class="heat-grid" role="img" aria-label="Daily activity over the last 18 weeks: ${total} updates on ${activeDays} days">${cells}</div></div>
    </div>
    <div class="heat-key">Less <i style="background:var(--raised)"></i><i style="background:color-mix(in srgb,var(--seq) 30%,var(--raised))"></i><i style="background:color-mix(in srgb,var(--seq) 55%,var(--raised))"></i><i style="background:color-mix(in srgb,var(--seq) 80%,var(--raised))"></i><i style="background:var(--seq)"></i> More</div>`,
    total, activeDays};
}
function breakdownHTML(all){

function statsHTML(){
  if (!state.apps.size) return emptyHTML();
  const all = [...state.apps.values()];
  const sent = all.filter(appliedEver);
  const steps = [
    {label:'Sent', n: sent.length, c:'applied'},

  role:['role','position','title','job title','job','position title','role title'],

  location:['location','city','office','where'],
  mode:['mode','work mode','remote','arrangement','work type','on site','onsite'],
  salary:['salary','pay','compensation','rate','wage','hourly'],
  appliedDate:['date applied','applied','applied on','application date','date','submitted','date submitted'],
  deadline:['deadline','apply by','due','due date','closing date'],
  nextStep:['next step','next steps','next action','to do','todo'],
  followUp:['follow up','followup','follow up date','next follow up','next step date','reminder'],
  source:['source','applied via','platform','found via','found on','site','channel'],
  referral:['referral','referred by','referrer','referred'],
  contact:['contact','recruiter','contact name','hiring manager','point of contact'],

  resume:['resume','resume version','cv','resume used'],
  notes:['notes','comments','note','comment','details','misc'],

const normH = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function guessMap(headers){
  const map = {}; const used = new Set(); const hs = headers.map(normH);
  for (const pass of ['exact', 'contains']) {
    for (const [field, syns] of Object.entries(SYN)) {
      if (map[field] !== undefined) continue;
      const idx = hs.findIndex((h, i) => !used.has(i) && h && syns.some(s => pass === 'exact' ? h === s : (h.includes(s) || (s.length > 4 && s.includes(h) && h.length > 3))));
      if (idx >= 0) { map[field] = idx; used.add(idx); }
    }
  }
  return map;
}
function normStage(v){
  const s = String(v || '').toLowerCase();
  if (!s) return 'applied';
  if (/offer|accepted/.test(s)) return 'offer';
  if (/reject|declin|denied|not selected|no longer/.test(s)) return 'rejected';
  if (/withdr|pulled/.test(s)) return 'withdrawn';
  if (/ghost|no response|no reply|silent/.test(s)) return 'ghosted';
  if (/interview|onsite|on-site|phone|screen|superday|final/.test(s)) return 'interview';
  if (/assess|\boa\b|online assessment|test|hackerrank|codesignal|hirevue|take.?home|coding challenge/.test(s)) return 'assessment';
  if (/wish|saved|to apply|interested|plan|not applied|bookmark/.test(s)) return 'wishlist';
  return 'applied';
}
function normType(v){
  const s = String(v || '').toLowerCase();
  if (/intern/.test(s)) return 'Internship';
  if (/full/.test(s)) return 'Full-time';
  if (/part/.test(s)) return 'Part-time';
  if (/co.?op/.test(s)) return 'Co-op';
  if (/contract/.test(s)) return 'Contract';
  return '';
}
function normSector(v){
  const s = String(v || '').toLowerCase(); if (!s) return '';
  if (/financ|bank|fintech|insur|trading|invest|capital/.test(s)) return 'Finance';
  if (/consult|advisory/.test(s)) return 'Consulting';
  if (/defen[cs]e|military|aerospace|national security/.test(s)) return 'Defense';
  if (/gov|public sector|federal|state/.test(s)) return 'Government';
  if (/tech|software|saas|ai|startup/.test(s)) return 'Tech';
  return 'Other';
}
function normMode(v){
  const s = String(v || '').toLowerCase();
  if (/hybrid/.test(s)) return 'Hybrid';
  if (/remote|yes/.test(s)) return 'Remote';
  if (/site|office|person|no/.test(s)) return 'On-site';
  return '';
}
function normSource(v){
  const s = String(v || '').trim(); if (!s) return '';
  const l = s.toLowerCase();
  return SOURCES.find(o => l.includes(o.toLowerCase().split(' ')[0])) || s;
}
function normDate(v){
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return isoOf(v);
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return isoOf(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim();
  if (parseISO(s)) return s;
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[1] - 1, +m[2]); return isNaN(d) ? '' : isoOf(d); }
  const t = Date.parse(s); return isNaN(t) ? '' : isoOf(new Date(t));
}

function mappedRows(){
  const map = {};

function navItems(){

}
function locate(cols, id){
  for (let c = 0; c < cols.length; c++) { const r = cols[c].indexOf(id); if (r >= 0) return [c, r]; }
  return null;
}
function setFocus(id, scroll=true){
  state.focusId = id;

  if (!id) return;
  const el = document.querySelector(`[data-id="${CSS.escape(id)}"].card, tr.row[data-id="${CSS.escape(id)}"]`);
  if (el) { el.classList.add('kf'); if (scroll) el.focus({preventScroll:false}); }
}
function restoreFocus(takeFocus){
  if (!state.focusId) return;
  const el = document.querySelector(`.card[data-id="${CSS.escape(state.focusId)}"], tr.row[data-id="${CSS.escape(state.focusId)}"]`);
  if (!el) return;
  el.classList.add('kf');

  if (takeFocus || (ae && (ae === document.body || ae.closest('.card, tr.row')))) {

}
function moveFocus(dc, dr){
  const cols = navItems(); if (!cols.length) return;
  let pos = state.focusId ? locate(cols, state.focusId) : null;
  if (!pos) { const c = cols.findIndex(col => col.length); if (c >= 0) setFocus(cols[c][0]); return; }
  let [c, r] = pos;
  if (dr) { r = Math.max(0, Math.min(cols[c].length - 1, r + dr)); setFocus(cols[c][r]); return; }
  let nc = c + dc;
  while (nc >= 0 && nc < cols.length && !cols[nc].length) nc += dc;
  if (nc < 0 || nc >= cols.length) return;
  setFocus(cols[nc][Math.min(r, cols[nc].length - 1)]);
}

  const id = state.focusId; const a = id && state.apps.get(id); if (!a) return;
  const to = dir > 0 ? nextStageOf(a) : prevStageOf(a);
  if (!to) { toast(dir > 0 ? (CLOSED.has(a.stage) ? 'Closed out. Press [ to reopen it.' : 'Already at Offer.') : 'Already at the first stage.', 2000); return; }
  moveStage(id, to);
  requestAnimationFrame(() => setFocus(id));
}

    if (modal.classList.contains('open')) { closeModal(); e.preventDefault(); return; }
    if (edit) { closeDrawer(); e.preventDefault(); return; }
    if (typing && e.target.id === 'q') { e.target.blur(); restoreFocus(true); return; }
    return;
  }
  if (edit && mod && (e.key === 's' || e.key === 'S' || e.key === 'Enter')) { e.preventDefault(); saveDrawer(); return; }
  if (modal.classList.contains('open')) {
    const pf = box.dataset.pickFor;
    if (pf && !typing && !mod) {
      const pick = {r:'rejected', w:'withdrawn', g:'ghosted'}[e.key.toLowerCase()];
      if (pick) { e.preventDefault(); moveStage(pf, pick); delete box.dataset.pickFor; closeModal(); }
    }
    return;
  }
  if (edit || typing || mod || e.altKey) return;
  const k = e.key;
  if (k === '/') { e.preventDefault(); if (state.view === 'stats') setView('board'); $('#q').focus(); $('#q').select(); return; }
  if (k === '?') { e.preventDefault(); openKeys(); return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); openDrawer(null); return; }
  if (k === 't' || k === 'T') { toggleTheme(); return; }
  if (k === 'g' || k === 'G') { syncGmail(); return; }
  if (k === '1' || k === '2' || k === '3') { setView(['board','list','stats'][+k - 1]); return; }
  if (state.view === 'stats') return;
  const nav = {ArrowDown:[0,1], j:[0,1], ArrowUp:[0,-1], k:[0,-1], ArrowLeft:[-1,0], h:[-1,0], ArrowRight:[1,0], l:[1,0]}[k];
  if (nav) { e.preventDefault(); moveFocus(nav[0], nav[1]); return; }
  if (!state.focusId || !state.apps.has(state.focusId)) return;
  if (k === 'Enter' || k === 'e') { e.preventDefault(); openDrawer(state.focusId); return; }
  if (k === ']') { e.preventDefault(); shiftStage(1); return; }
  if (k === '[') { e.preventDefault(); shiftStage(-1); return; }
  if (k === 'x' || k === 'X') { e.preventDefault(); if (!CLOSED.has(state.apps.get(state.focusId).stage)) pickClosed(state.focusId); return; }
  if (k === 'f' || k === 'F') {
    e.preventDefault(); const a = state.apps.get(state.focusId); if (CLOSED.has(a.stage)) return;
    const d = clone(a); d.followUp = addDays(TODAY(), 3); if (!d.nextStep) d.nextStep = 'Follow up';
    persist(state.focusId, d); toast(`${a.company}: reminder set for ${relDay(d.followUp)}.`, 2200);
  }
});

/* drag and drop */
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  dragId = c.dataset.id; c.classList.add('dragging'); tip.classList.remove('on');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
});
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.card'); if (c) c.classList.remove('dragging'); $$('.col.drop').forEach(x => x.classList.remove('drop')); dragId = null; });
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.col.drop').forEach(x => { if (x !== col) x.classList.remove('drop'); });
  col.classList.add('drop');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return;
  e.preventDefault(); col.classList.remove('drop');
  const id = dragId; dragId = null;
  const def = COLUMNS.find(c => c.id === col.dataset.col), a = state.apps.get(id);
  if (!def || !a || def.stages.includes(a.stage)) return;
  state.focusId = id;
  if (def.id === 'closed') pickClosed(id); else moveStage(id, def.stages[0]);
});

/* detail panel events */
$('#dr-close').addEventListener('click', () => closeDrawer());
$('#dr-cancel').addEventListener('click', () => closeDrawer());
scrim.addEventListener('click', () => closeDrawer());
$('#dr-save').addEventListener('click', saveDrawer);
$('#dr-discard').addEventListener('click', () => closeDrawer(true));
$('#dr-keep').addEventListener('click', () => $('#dr-confirm').classList.remove('open'));
form.addEventListener('submit', e => { e.preventDefault(); saveDrawer(); });
drawer.addEventListener('input', e => {
  if (e.target.closest('.tl-add')) return;
  if (e.target.id === 'f_url') syncUrl();
  if (e.target.id === 'f_company') syncHeader();
  markDirty(true);
});
drawer.addEventListener('change', e => {
  if (e.target.closest('.tl-add')) return;
  if (e.target.id === 'f_close') {
    const v = e.target.value;
    if (v) setDraftStage(v);
    else if (CLOSED.has($('#f_stage').value)) setDraftStage(PIPE[Math.max(1, furthestPipe(Object.assign({}, edit.draft, {stage:'wishlist'})))]);
    return;
  }
  markDirty(true);
});
$('#stepper').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) setDraftStage(b.dataset.step); });
$('#dr-delete').addEventListener('click', () => {
  const b = $('#dr-delete');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Click again to delete'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Delete'; }, 4000); return; }
  const id = edit.id, name = edit.original.company;
  removeApp(id); closeDrawer(true); toast(`Deleted ${name || 'application'}.`);
});
function addTimeline(){
  const text = $('#tl-text').value.trim(); if (!text) { $('#tl-text').focus(); return; }
  readForm();
  edit.draft.events.push({date: $('#tl-date').value || TODAY(), kind:'note', text});
  $('#tl-text').value = ''; renderTimeline(); markDirty(true);
}
$('#tl-add').addEventListener('click', addTimeline);
$('#tl-text').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTimeline(); } });
$('#tl').addEventListener('click', e => {
  const x = e.target.closest('[data-rm]'); if (!x) return;
  readForm(); edit.draft.events.splice(+x.dataset.rm, 1); renderTimeline(); markDirty(true);
});

/* ================= boot ================= */
async function init(){
  fillSelects();
  const d = new Date(); $('#today').textContent = `${DOW[d.getDay()]}, ${fmtDate(TODAY(), true)}`;
  const h = location.hash.slice(1); if (['board','list','stats'].includes(h)) state.view = h;
  render();
  api('GET', '/api/config').then(c => {
    state.extract = !!c.extract; $('#btn-paste').classList.toggle('hidden', !state.extract);
    if (c.ai) document.querySelectorAll('.ai-name').forEach(el => { el.textContent = c.ai; });
    if (c.demo) {
      const strip = $('#demo-strip');
      strip.innerHTML = `<span><b>Demo.</b> Sample data from invented companies. Edit anything; it resets every ${c.demoResetMinutes || 60} minutes.</span>`
        + (c.repoUrl ? `<a href="${esc(c.repoUrl)}" target="_blank" rel="noopener">Source on GitHub ↗</a>` : '');
      strip.classList.remove('hidden');
    }
  }).catch(() => {});
  await refresh();
  loadGmail();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !edit) { refresh(); loadGmail(); } });
}
init();
})();
</script>
</body>
